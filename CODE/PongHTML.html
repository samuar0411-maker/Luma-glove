<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>PONG - 1 Flex Sensor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial;
            color: white;
        }

        canvas {
            border: 4px solid #fff;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
            color: #0ff;
        }

        #sensorValues {
            font-size: 18px;
            color: #ff0;
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="status">✅ Conectado - Flex Sensor</div>
    <div id="sensorValues">Flex: ---</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const WIDTH = 800, HEIGHT = 500;

        let leftPaddleY = (HEIGHT - 100) / 2;
        let rightPaddleY = (HEIGHT - 100) / 2;
        let ballX = WIDTH / 2, ballY = HEIGHT / 2, ballSpeedX = 6, ballSpeedY = 4;
        let leftScore = 0, rightScore = 0;
        let gameRunning = true, gameStarted = false;
        const keys = {};

        let flexValue = 0;

        // === UMBRAL actualizado ===
        // Recto: ~400+ | Doblado: ~300+
        const UMBRAL = 360;
        const PADDLE_SPEED = 7;
        const winningScore = 10;

        document.addEventListener("keydown", e => keys[e.key] = true);
        document.addEventListener("keyup", e => keys[e.key] = false);

        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                const reader = port.readable.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                document.getElementById("status").innerHTML = "✅ Conectado - Recto = Sube | Doblado = Baja";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (let line of lines) {
                        line = line.trim().replace(/\r/g, '');

                        if (line.length > 0 && /\d/.test(line)) {
                            const numbers = line.match(/\d+/g);
                            if (numbers && numbers.length > 0) {
                                flexValue = parseInt(numbers[0]);
                                document.getElementById("sensorValues").innerHTML =
                                    `Flex: <strong>${flexValue}</strong>`;
                            }
                        }
                    }
                }
            } catch (err) {
                alert("Error de conexión: " + err.message);
            }
        }

        document.addEventListener("click", () => {
            connectSerial();
        }, { once: true });

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(WIDTH / 2, 0);
            ctx.lineTo(WIDTH / 2, HEIGHT);
            ctx.stroke();

            ctx.fillStyle = "#0ff";
            ctx.fillRect(20, leftPaddleY, 12, 100);
            ctx.fillRect(WIDTH - 32, rightPaddleY, 12, 100);

            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = "bold 48px Arial";
            ctx.fillText(leftScore, WIDTH / 4, 70);
            ctx.fillText(rightScore, 3 * WIDTH / 4, 70);

            if (!gameRunning && gameStarted) {
                ctx.font = "bold 50px Arial";
                ctx.fillStyle = "#f00";
                ctx.fillText(leftScore >= winningScore ? "¡GANASTE!" : "¡PERDISTE!", WIDTH / 2, HEIGHT / 2);
                ctx.font = "30px Arial";
                ctx.fillStyle = "#fff";
                ctx.fillText("Presiona ESPACIO para reiniciar", WIDTH / 2, HEIGHT / 2 + 70);
            }
        }

        function update() {
            if (!gameRunning || !gameStarted) return;

            // === LÓGICA ===
            // Valor bajo (~300) = Doblado → Baja
            // Valor alto (~400+) = Recto → Sube
            if (flexValue < UMBRAL) {
                leftPaddleY += PADDLE_SPEED;   // Doblado → Baja
            } else {
                leftPaddleY -= PADDLE_SPEED;   // Recto → Sube
            }

            // Límites
            if (leftPaddleY < 0) leftPaddleY = 0;
            if (leftPaddleY > HEIGHT - 100) leftPaddleY = HEIGHT - 100;

            // IA derecha
            if (rightPaddleY + 50 < ballY) rightPaddleY += 7;
            else if (rightPaddleY + 50 > ballY) rightPaddleY -= 7;

            if (rightPaddleY < 0) rightPaddleY = 0;
            if (rightPaddleY > HEIGHT - 100) rightPaddleY = HEIGHT - 100;

            // Pelota
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            if (ballY < 10 || ballY > HEIGHT - 10) ballSpeedY = -ballSpeedY;

            // Colisiones
            if (ballX < 32 && ballY > leftPaddleY && ballY < leftPaddleY + 100 && ballSpeedX < 0) {
                ballSpeedX = -ballSpeedX;
            }
            if (ballX > WIDTH - 32 && ballY > rightPaddleY && ballY < rightPaddleY + 100 && ballSpeedX > 0) {
                ballSpeedX = -ballSpeedX;
            }

            // Puntos (hasta 10)
            if (ballX < 0) {
                rightScore++;
                if (rightScore >= winningScore || leftScore >= winningScore) {
                    gameRunning = false;
                } else {
                    resetBall();
                }
            }
            if (ballX > WIDTH) {
                leftScore++;
                if (leftScore >= winningScore || rightScore >= winningScore) {
                    gameRunning = false;
                } else {
                    resetBall();
                }
            }
        }

        function resetBall() {
            ballX = WIDTH / 2;
            ballY = HEIGHT / 2;
            ballSpeedX = (Math.random() > 0.5 ? 6 : -6);
            ballSpeedY = (Math.random() * 8) - 4;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();

        document.addEventListener("keydown", e => {
            if (e.key === " " && (!gameStarted || !gameRunning)) {
                leftScore = 0;
                rightScore = 0;
                gameStarted = true;
                gameRunning = true;
                resetBall();
            }
        });
    </script>
</body>

</html>
